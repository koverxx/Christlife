<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christlife Church</title>
  </head>
  <body
    class="font-urbanist min-h-screen bg-slate-50 dark:bg-[#333333] dark:text-white"
  >
    <header
      class="bg-white text-black flex py-5 items-center justify-between px-[5%]"
    >
      <div class="">
        <img
          src="Images/logo.png"
          alt="logo"
          class="w-[50px] lg:w-[80px] md:w-[60px]"
        />
      </div>
      <div class="md:flex hidden">
        <nav class="">
          <ul class="flex items-center">
            <a href="about.html" class="hover:opacity-90 mb-2 sm:mr-4 px-2"
              >About</a
            >
            <a href="connect.html" class="hover:opacity-90 mb-2 sm:mr-4 px-2"
              >Connect</a
            >
            <a href="sermons.html" class="hover:opacity-90 mb-2 sm:mr-4 px-2"
              >Sermons</a
            >
            <a href="#give" class="hover:opacity-90 mb-2 sm:mr-4 px-2">Give</a>
            <a
              href="#visit"
              class="hover:opacity-90 mb-2 sm:mr-4 inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-green-600 border border-transparent rounded-full hover:bg-green-600 focus:outline-none transition duration-150 ease-in-out"
              >Visit</a
            >
          </ul>
        </nav>
      </div>
      <button
        id="mobile-open-button"
        class="text-3xl sm:hidden focus:outline-none"
      >
        &#9776;
      </button>
    </header>

    <main class="py-0">
      <div class="max-w-7xl mx-auto p-4">
        <!-- Header -->
        <h1
          class="text-[] leading-[] lg:text-[55px] lg:leading-[66px] font-bold text-center mt-10 mb-5 text-[#333333]"
        >
          Watch Christlife Family Chapel
        </h1>

        <!-- Buttons -->
        <div class="flex justify-center mt-5 space-x-4 mb-5 gap-8">
          <a
            href="#"
            class="border bg-[#128546] text-white py-2 px-6 rounded-full shadow-md"
            >YouTube Videos</a
          >
          <a
            href="#"
          class="border border-[#128546] text-[#128546] py-2 px-6 rounded-full shadow-md"
            >Facebook Livestream</a
          >
        </div>

        <!-- Video Section -->
        <div class="flex justify-center mt-10">
          <div class="relative w-full max-w-4xl">
            <img
              src="Images/Frame8.png"
              alt="Video Thumbnail"
              class="w-full rounded-lg shadow-md"
            />
          </div>
        </div>

        <!-- Additional Content -->
        <div class="text-center mt-8">
          <h2 class="text-3xl font-semibold">Watch Clips</h2>
          <form class="flex justify-center mt-4">
            <input
              type="text"
              placeholder="Search for Clip..."
              class="border border-gray-300 rounded-full py-2 px-4 w-64"
            />
            <button
              type="submit"
              class="bg-green-500 text-white rounded-full py-2 px-6 ml-2 hover:bg-green-600">
              Search
            </button>
          </form>
        </div>
      </div>
    </main>





    
  </body>
</html>
